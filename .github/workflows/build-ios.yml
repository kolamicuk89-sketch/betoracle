name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.1xx

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Select Xcode 26.5
        run: |
          ls /Applications/ | grep -i xcode
          sudo xcode-select -s "/Applications/Xcode_26.5.app/Contents/Developer"
          xcodebuild -version

      - name: Publish unsigned device build
        run: |
          dotnet publish BetOracle/BetOracle.csproj \
            -f net9.0-ios \
            -p:TargetFrameworks=net9.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:EnablePackageSigning=false \
            -p:MtouchLink=SdkOnly

      - name: Collect IPA
        run: |
          IPA=$(find . -name "*.ipa" | head -n 1)
          echo "IPA found: $IPA"
          if [ -z "$IPA" ]; then
            echo "::error::No IPA found, dumping bin tree:"
            find BetOracle/bin -maxdepth 5 | head -60
            exit 1
          fi
          cp "$IPA" unsigned.ipa
          ls -lh unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetOracle-unsigned-ipa
          path: unsigned.ipa
